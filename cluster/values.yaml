  - name: arc-runners
    chart: gha-runner-scale-set
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts
    version: 0.15.1
    namespace: arc-runners
    layer: platform
    providers: [eks, baremetal, doks]
    wave: 4
    category: system
    when: '{{ has "arc" .Values.enable }}'
    values: |
      githubConfigUrl: {{ .Values.arc.githubConfigUrl | quote }}
      # Seeded by bootstrap with the GitHub App id, installation id, and private key.
      githubConfigSecret: arc-github-app
      runnerScaleSetName: {{ .Values.clusterName }}
      maxRunners: {{ .Values.arc.maxRunners }}
      # Helm lookup can't find the controller under Argo CD; tracks the arc release name.
      controllerServiceAccount:
        namespace: arc-systems
        name: arc-gha-rs-controller
      containerMode:
        type: kubernetes
        kubernetesModeWorkVolumeClaim:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
      template:
        spec:
          containers:
            - name: runner
              # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
              image: ghcr.io/actions/actions-runner:2.338.2
              command: [/home/runner/run.sh]
              env:
                # Jobs without `container:` run in the runner pod instead of failing.
                - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                  value: "false"

  # OpenBao (ADR 69): auto-unsealed from the seeded key, self-initialized; apps read it via external-secrets.
  - name: openbao
    chart: openbao
    repoURL: https://openbao.github.io/openbao-helm
    version: 0.30.6
    namespace: openbao
    layer: platform
    optIn: true
    providers: [eks, baremetal, doks]
    wave: 3
    category: security
    values: |
      injector:
        enabled: false
      server:
        ha:
          enabled: true
          replicas: 3
          raft:
            enabled: true
            setNodeId: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path = "/openbao/data"
                retry_join {
                  leader_api_addr = "http://openbao-0.openbao-internal:8200"
                }
                retry_join {
                  leader_api_addr = "http://openbao-1.openbao-internal:8200"
                }
                retry_join {
                  leader_api_addr = "http://openbao-2.openbao-internal:8200"
                }
              }
              service_registration "kubernetes" {}
              # Key seeded by bootstrap from 1Password; the default chart config can't unseal itself.
              seal "static" {
                current_key_id = "1"
                current_key = "env://BAO_SEAL_KEY"
              }
              # The only config OpenBao gets: a way in, since self-init revokes its root token.
              initialize "kubernetes-auth" {
                request "enable" {
                  operation = "update"
                  path = "sys/auth/kubernetes"
                  data = { type = "kubernetes" }
                }
                request "config" {
                  operation = "update"
                  path = "auth/kubernetes/config"
                  data = { kubernetes_host = "https://kubernetes.default.svc" }
                }
              }
              initialize "admin" {
                request "policy" {
                  operation = "update"
                  path = "sys/policies/acl/admin"
                  data = {
                    policy = <<EOP
              path "*" {
                capabilities = ["create", "read", "update", "patch", "delete", "list", "sudo"]
              }
              EOP
                  }
                }
                request "role" {
                  operation = "update"
                  path = "auth/kubernetes/role/admin"
                  data = {
                    bound_service_account_names = ["openbao-admin"]
                    bound_service_account_namespaces = ["openbao"]
                    token_policies = ["admin"]
                  }
                }
              }
        extraSecretEnvironmentVars:
          - envName: BAO_SEAL_KEY
            secretName: openbao-seal
            secretKey: key
      extraObjects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: openbao-admin
            namespace: openbao

