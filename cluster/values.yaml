# Catalog for the app-of-apps (root.yass.yaml Catalog, GitOpsConventions).
# Cluster values (clusters/<name>.yaml) are layered on top; `values` and `when` are tpl'd.

layer: ""
gitRepo: https://github.com/jmreicha/kubernetes-infrastructure.git
gitRevision: main
# Path from the repo root to this cluster's values file; set by bootstrap.sh.
clusterValuesFile: ""

# Cluster values defaults (see docs/spec/values).
provider: ""
clusterName: ""
domain: ""
coreOnly: false
# Catalog entries marked `optional` are installed unless named here.
disable: []
# Catalog entries marked `optIn` are installed only when named here.
enable: []
pullThroughCacheIp: ""
# Where this cluster's argocd-agent finds the hub's principal (when argocd-agent is enabled).
argocdAgent:
  principalAddress: ""
  principalPort: 443
# Extra baremetal CSI drivers (when enabled): NFS export, democratic-csi driver name.
nfs:
  server: ""
  share: ""
democraticCsi:
  driver: ""
# Identity add-ons (when enabled): external Postgres host (port defaults to 5432), OIDC issuer.
authentik:
  postgresHost: ""
keycloak:
  postgresHost: ""
oauth2Proxy:
  issuerUrl: ""
# Monitors beyond the catalog defaults, or none at all (ADR 68); only while a metrics stack is on.
monitor:
  add: []
  remove: []
# Set by scripts/bootstrap-cluster and scripts/talos-cilium-patch: no ServiceMonitor CRD exists yet.
skipMonitors: false
# GitHub Actions runners (when arc is enabled): where they register, and the scale-out cap.
arc:
  githubConfigUrl: ""
  maxRunners: 5

# Upstream registries the pull-through cache (zot) mirrors, by host.
pullThroughCacheRegistries:
  docker.io: https://registry-1.docker.io
  ghcr.io: https://ghcr.io
  quay.io: https://quay.io
  registry.k8s.io: https://registry.k8s.io
  public.ecr.aws: https://public.ecr.aws
  gcr.io: https://gcr.io

# Namespaces whose workloads need host access (docs/spec/security); all others enforce baseline.
privilegedNamespaces:
  [
    kube-system,
    falco,
    longhorn-system,
    rook-ceph,
    democratic-csi,
    local-path-storage,
    kubevirt,
    cdi,
    monitoring,
  ]

# Cluster-scoped kinds the platform AppProject may create.
platformClusterKinds:
  - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
  - { group: rbac.authorization.k8s.io, kind: ClusterRole }
  - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
  - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
  - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
  - { group: "", kind: Namespace }
  - { group: apiregistration.k8s.io, kind: APIService }
  - { group: scheduling.k8s.io, kind: PriorityClass }
  - { group: cdi.kubevirt.io, kind: CDI }
  - { group: operators.coreos.com, kind: OLMConfig }
  - { group: everest.percona.com, kind: DataImporter }
  - { group: everest.percona.com, kind: LoadBalancerConfig }
  - { group: everest.percona.com, kind: PodSchedulingPolicy }

catalog:
  # --- bootstrap (installed by bootstrap.sh, then adopted) ---
  - name: cilium
    chart: cilium
    repoURL: https://helm.cilium.io
    version: 1.20.2
    namespace: kube-system
    layer: bootstrap
    providers: [eks, baremetal]
    wave: 0
    category: networking
    monitor: |
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          # The CRDs come from the bootstrap layer; Helm can't always see them at render time.
          trustCRDsExist: true
      operator:
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
    monitorByDefault: true
    values: |
      kubeProxyReplacement: true
      encryption:
        enabled: true
        type: wireguard
      # Report, don't drop, until docs/spec/security says otherwise.
      policyAuditMode: true
      k8sServiceHost: {{ .Values.apiServerHost }}
      k8sServicePort: {{ .Values.apiServerPort }}
      gatewayAPI:
        enabled: false
      hubble:
        tls:
          auto:
            method: cronJob
        relay:
          enabled: true
        ui:
          enabled: true
      {{- if eq .Values.provider "eks" }}
      eni:
        enabled: true
      ipam:
        mode: eni
      routingMode: native
      egressMasqueradeInterfaces: eth+
      {{- else }}
      ipam:
        mode: kubernetes
      l2announcements:
        enabled: true
      externalIPs:
        enabled: true
      cgroup:
        autoMount:
          enabled: false
        hostRoot: /sys/fs/cgroup
      securityContext:
        capabilities:
          ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
          cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
      {{- end }}

  - name: argo-cd
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    version: 10.10.2
    namespace: argocd
    layer: bootstrap
    providers: [eks, baremetal, doks]
    wave: 0
    category: system
    monitor: |
      controller:
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
      server:
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
      repoServer:
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
      applicationSet:
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
    monitorByDefault: true
    values: |
      configs:
        cm:
          accounts.kubechecks: apiKey
          # Report child Application health so app-of-apps sync waves wait on it.
          resource.customizations.health.argoproj.io_Application: |
            hs = {}
            hs.status = "Progressing"
            hs.message = ""
            if obj.status ~= nil and obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
            return hs
        rbac:
          policy.csv: |
            g, kubechecks, role:readonly

  # --- core ---
  # -- storage --
  - name: aws-ebs-csi-driver
    chart: aws-ebs-csi-driver
    repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    version: 2.66.1
    namespace: kube-system
    layer: core
    providers: [eks]
    wave: 1
    category: storage
    monitor: |
      controller:
        enableMetrics: true
        serviceMonitor:
          forceEnable: true
    monitorByDefault: true
    values: |
      storageClasses:
        - name: gp3
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
          volumeBindingMode: WaitForFirstConsumer
          allowVolumeExpansion: true
          parameters:
            type: gp3

  - name: longhorn
    chart: longhorn
    repoURL: https://charts.longhorn.io
    version: 1.13.0
    namespace: longhorn-system
    layer: core
    optional: true
    providers: [baremetal]
    wave: 1
    category: storage
    monitor: |
      metrics:
        serviceMonitor:
          enabled: true
    monitorByDefault: true
    values: |
      persistence:
        defaultClass: true
      preUpgradeChecker:
        jobEnabled: false

  # Rook Ceph replaces Longhorn (values policy requires longhorn disabled); enable: [rook] adds both.
  - name: rook
    chart: rook-ceph
    repoURL: https://charts.rook.io/release
    version: v1.21.0
    namespace: rook-ceph
    layer: core
    optIn: true
    providers: [baremetal]
    wave: 1
    category: storage

  - name: rook-ceph-cluster
    chart: rook-ceph-cluster
    repoURL: https://charts.rook.io/release
    version: v1.21.0
    namespace: rook-ceph
    layer: core
    providers: [baremetal]
    wave: 2
    category: storage
    monitor: |
      # The operator creates the Ceph ServiceMonitors at runtime; the chart adds the alert rules.
      monitoring:
        enabled: true
        createPrometheusRules: true
    monitorByDefault: true
    when: '{{ has "rook" .Values.enable }}'
    values: |
      # Block only; the chart's ceph-block pool is the default StorageClass.
      cephFileSystems: []
      cephObjectStores: []

  # Extra CSI drivers alongside the default storage, each with a non-default StorageClass.
  - name: csi-driver-nfs
    chart: csi-driver-nfs
    repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    version: 4.13.4
    namespace: kube-system
    layer: core
    optIn: true
    providers: [baremetal]
    wave: 1
    category: storage
    values: |
      storageClass:
        create: true
        name: nfs-csi
        parameters:
          server: {{ .Values.nfs.server | quote }}
          share: {{ .Values.nfs.share | quote }}
        reclaimPolicy: Delete
        volumeBindingMode: Immediate

  # iSCSI through democratic-csi; the driver config (backend and credentials) is seeded by bootstrap.
  - name: democratic-csi
    chart: democratic-csi
    repoURL: https://democratic-csi.github.io/charts
    version: 0.15.1
    namespace: democratic-csi
    layer: core
    optIn: true
    providers: [baremetal]
    wave: 1
    category: storage
    values: |
      csiDriver:
        name: org.democratic-csi.iscsi
      driver:
        existingConfigSecret: democratic-csi-driver-config
        config:
          driver: {{ .Values.democraticCsi.driver | quote }}
      storageClasses:
        - name: iscsi
          defaultClass: false
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          allowVolumeExpansion: true
          parameters:
            fsType: ext4
      # The chart defaults to :latest; pin the image (docs/spec/security).
      controller:
        driver:
          image:
            # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
            tag: v1.1.0
      # Talos: iscsiadm runs on the host through nsenter (needs the iscsi-tools extension).
      node:
        hostPID: true
        driver:
          image:
            # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
            tag: v1.1.0
          extraEnv:
            - name: ISCSIADM_HOST_STRATEGY
              value: nsenter
            - name: ISCSIADM_HOST_PATH
              value: /usr/local/sbin/iscsiadm
          iscsiDirHostPath: /usr/local/etc/iscsi
          iscsiDirHostPathType: ""

  - name: local-path-provisioner
    path: deploy/chart/local-path-provisioner
    repoURL: https://github.com/rancher/local-path-provisioner.git
    version: v0.0.37
    namespace: local-path-storage
    layer: core
    optional: true
    providers: [baremetal]
    wave: 1
    category: storage
    when: '{{ and (has "longhorn" .Values.disable) (not (has "rook" .Values.enable)) }}'
    values: |
      storageClass:
        defaultClass: true
      nodePathMap:
        - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
          paths: [/var/local-path-provisioner]

  # -- compute --
  - name: karpenter
    chart: karpenter
    repoURL: oci://public.ecr.aws/karpenter
    version: 1.15.0
    namespace: kube-system
    layer: core
    providers: [eks]
    wave: 1
    category: compute
    monitor: |
      serviceMonitor:
        enabled: true
    monitorByDefault: true
    values: |
      settings:
        clusterName: {{ .Values.clusterName }}

  # -- security --
  - name: cert-manager
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    version: v1.21.2
    namespace: cert-manager
    layer: core
    providers: [eks, baremetal, doks]
    wave: 1
    category: security
    monitor: |
      prometheus:
        servicemonitor:
          enabled: true
    monitorByDefault: true
    values: |
      crds:
        enabled: true

  - name: gatekeeper
    chart: gatekeeper
    repoURL: https://open-policy-agent.github.io/gatekeeper/charts
    version: 3.23.1
    namespace: gatekeeper-system
    layer: core
    providers: [eks, baremetal, doks]
    wave: 1
    category: security

  # gatekeeper-library publishes no releases, so its templates pin a commit.
  - name: gatekeeper-templates-psp
    path: library/pod-security-policy
    repoURL: https://github.com/open-policy-agent/gatekeeper-library.git
    version: f8e3b4e9ab3b7d1a28092da75c2c5e71aedfd4b9
    namespace: gatekeeper-system
    layer: core
    providers: [eks, baremetal, doks]
    wave: 2
    category: security

  - name: gatekeeper-templates-general
    path: library/general
    repoURL: https://github.com/open-policy-agent/gatekeeper-library.git
    version: f8e3b4e9ab3b7d1a28092da75c2c5e71aedfd4b9
    namespace: gatekeeper-system
    layer: core
    providers: [eks, baremetal, doks]
    wave: 2
    category: security

  - name: external-secrets
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    version: 2.12.0
    namespace: external-secrets
    layer: core
    providers: [eks, baremetal, doks]
    wave: 1
    category: security
    monitor: |
      serviceMonitor:
        enabled: true
    monitorByDefault: true

  - name: onepassword-connect
    chart: connect
    repoURL: https://1password.github.io/connect-helm-charts
    version: 2.4.2
    namespace: onepassword
    layer: core
    providers: [eks, baremetal, doks]
    wave: 1
    category: security
    monitor: |
      connect:
        api:
          serviceMonitor:
            enabled: true
    values: |
      connect:
        credentialsName: op-credentials
        credentialsKey: 1password-credentials.json
      operator:
        create: true
        token:
          name: onepassword-token
          key: token

  - name: falco
    chart: falco
    repoURL: https://falcosecurity.github.io/charts
    version: 9.2.0
    namespace: falco
    layer: core
    optIn: true
    providers: [eks, baremetal, doks]
    wave: 2
    category: security
    monitor: |
      metrics:
        enabled: true
      serviceMonitor:
        create: true
    monitorByDefault: true
    values: |
      driver:
        kind: modern_ebpf

  - name: tetragon
    chart: tetragon
    repoURL: https://helm.cilium.io
    version: 1.7.1
    namespace: kube-system
    layer: core
    optIn: true
    providers: [eks, baremetal, doks]
    wave: 2
    category: security
    monitor: |
      tetragon:
        prometheus:
          serviceMonitor:
            enabled: true
      tetragonOperator:
        prometheus:
          serviceMonitor:
            enabled: true
    monitorByDefault: true

  # -- networking --
  - name: envoy-gateway
    chart: gateway-helm
    repoURL: oci://registry-1.docker.io/envoyproxy
    version: 1.9.2
    namespace: envoy-gateway-system
    layer: core
    providers: [eks, baremetal]
    wave: 1
    category: networking

  - name: external-dns
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns
    version: 1.23.0
    namespace: external-dns
    layer: core
    providers: [eks, baremetal, doks]
    wave: 2
    category: networking
    monitor: |
      serviceMonitor:
        enabled: true
    monitorByDefault: true
    when: '{{ ne .Values.domain "" }}'
    values: |
      domainFilters: [{{ .Values.domain }}]
      txtOwnerId: {{ .Values.clusterName }}
      policy: sync
      {{- if eq .Values.provider "eks" }}
      provider:
        name: aws
      {{- else if eq .Values.provider "doks" }}
      provider:
        name: digitalocean
      env:
        - name: DO_TOKEN
          valueFrom:
            secretKeyRef:
              name: digitalocean-api-token
              key: token
      {{- else }}
      provider:
        name: cloudflare
      env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: token
      {{- end }}

  - name: aws-load-balancer-controller
    chart: aws-load-balancer-controller
    repoURL: https://aws.github.io/eks-charts
    version: 3.6.0
    namespace: kube-system
    layer: core
    providers: [eks]
    wave: 2
    category: networking
    monitor: |
      serviceMonitor:
        enabled: true
    monitorByDefault: true
    values: |
      clusterName: {{ .Values.clusterName }}
      enableCertManager: true
      region: {{ .Values.region }}
      vpcId: {{ .Values.vpcId }}

  # -- observability --
  - name: metrics-server
    chart: metrics-server
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    version: 3.14.0
    namespace: kube-system
    layer: core
    providers: [eks, baremetal, doks]
    wave: 2
    category: observability
    monitor: |
      metrics:
        enabled: true
      serviceMonitor:
        enabled: true
    values: |
      {{- if eq .Values.provider "baremetal" }}
      # Talos kubelets serve self-signed certs by default.
      args: [--kubelet-insecure-tls]
      {{- end }}

  - name: kube-state-metrics
    chart: kube-state-metrics
    repoURL: https://prometheus-community.github.io/helm-charts
    version: 8.6.0
    namespace: kube-system
    layer: core
    providers: [eks, baremetal, doks]
    wave: 2
    category: observability
    monitor: |
      prometheus:
        monitor:
          enabled: true
    monitorByDefault: true

  # Metrics stacks (ADR 65) and Grafana (ADR 66); node-exporter makes monitoring privileged.
  - name: prometheus-operator-crds
    chart: prometheus-operator-crds
    repoURL: https://prometheus-community.github.io/helm-charts
    version: 32.0.2
    namespace: monitoring
    layer: bootstrap
    providers: [eks, baremetal, doks]
    wave: 0
    category: observability
    when: '{{ ne (include "apps.metricsStack" .) "" }}'

  - name: kube-prometheus-stack
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    version: 92.17.0
    namespace: monitoring
    layer: core
    optIn: true
    providers: [eks, baremetal, doks]
    wave: 2
    category: observability
    values: |
      crds:
        enabled: false
      grafana:
        enabled: false
        # Dashboards still ship as ConfigMaps for the grafana entry's sidecar.
        forceDeployDashboards: true
      kubeStateMetrics:
        enabled: false
      # Managed control planes don't expose these, and Cilium replaces kube-proxy.
      kubeEtcd: { enabled: false }
      kubeControllerManager: { enabled: false }
      kubeScheduler: { enabled: false }
      kubeProxy: { enabled: false }
      prometheusOperator:
        admissionWebhooks:
          certManager:
            enabled: true
      prometheus:
        prometheusSpec:
          # Select every monitor and rule in the cluster, not only this release's.
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          scrapeConfigSelectorNilUsesHelmValues: false

  - name: victoria-metrics-k8s-stack
    chart: victoria-metrics-k8s-stack
    repoURL: https://victoriametrics.github.io/helm-charts
    version: 0.97.1
    namespace: monitoring
    layer: core
    optIn: true
    providers: [eks, baremetal, doks]
    wave: 2
    category: observability
    values: |
      # The chart's scrape selectors need the Argo CD Application name as the release.
      argocdReleaseOverride: victoria-metrics-k8s-stack
      grafana:
        enabled: false
      kube-state-metrics:
        enabled: false
      # Its sync job downloads dashboards at runtime; keep the render declarative.
      defaultDashboards:
        enabled: false
      kubeEtcd: { enabled: false }
      kubeControllerManager: { enabled: false }
      kubeScheduler: { enabled: false }
      kubeProxy: { enabled: false }
      victoria-metrics-operator:
        # Short name: the cleanup Job's name becomes a pod label, capped at 63 characters.
        fullnameOverride: vm-operator
        admissionWebhooks:
          certManager:
            enabled: true

  - name: grafana
    chart: grafana
    repoURL: https://grafana-community.github.io/helm-charts
    version: 14.3.0
    namespace: monitoring
    layer: core
    optIn: true
    providers: [eks, baremetal, doks]
    wave: 2
    category: observability
    monitor: |
      serviceMonitor:
        enabled: true
    values: |
      # Seeded by bootstrap; the chart would otherwise generate a new password every render.
      admin:
        existingSecret: grafana
        userKey: admin-user
        passwordKey: admin-password
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
      {{- with include "apps.metricsStack" . }}
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: {{ ternary "Prometheus" "VictoriaMetrics" (eq . "kube-prometheus-stack") }}
              type: prometheus
              isDefault: true
              url: {{ ternary "http://kube-prometheus-stack-prometheus.monitoring:9090" "http://vmsingle-victoria-metrics-k8s-stack.monitoring:8428" (eq . "kube-prometheus-stack") }}
      {{- end }}

  - name: opentelemetry-operator
    chart: opentelemetry-operator
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.124.1
    namespace: opentelemetry
    layer: core
    providers: [eks, baremetal, doks]
    wave: 2
    category: observability
    monitor: |
      manager:
        serviceMonitor:
          enabled: true

  # -- system --
  # Argo CD agent (argoproj-labs/argocd-agent): opt-in hub-and-spoke visibility over each
  # cluster's own Argo CD. Certificates come from 1Password via bootstrap, never generated.
  - name: argocd-agent
    chart: argocd-agent-agent
    repoURL: oci://ghcr.io/argoproj-labs/argocd-agent
    version: 0.2.8
    namespace: argocd
    layer: core
    optIn: true
    providers: [eks, baremetal, doks]
    wave: 2
    category: system
    monitor: |
      serviceMonitor:
        enabled: true
    values: |
      agentMode: autonomous
      server: {{ .Values.argocdAgent.principalAddress | quote }}
      serverPort: {{ .Values.argocdAgent.principalPort | quote }}
      auth: mtls:any
      tlsSecretName: argocd-agent-client-tls
      tlsRootCASecretName: argocd-agent-ca

  - name: argocd-agent-principal
    chart: argocd-agent-principal
    repoURL: oci://ghcr.io/argoproj-labs/argocd-agent
    version: 0.3.6
    namespace: argocd
    layer: core
    optIn: true
    providers: [eks, baremetal, doks]
    wave: 2
    category: system
    monitor: |
      serviceMonitor:
        enabled: true
    values: |
      service:
        type: LoadBalancer
      principal:
        auth: mtls:CN=([^,]+)
        jwt:
          allowGenerate: false
          secretName: argocd-agent-jwt
        tls:
          secretName: argocd-agent-principal-tls
          server:
            allowGenerate: false
            rootCaSecretName: argocd-agent-ca

  - name: zot
    chart: zot
    repoURL: https://zotregistry.dev/helm-charts
    version: 0.1.128
    namespace: zot
    layer: core
    optIn: true
    providers: [baremetal]
    wave: 2
    category: system
    monitor: |
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    values: |
      service:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: {{ .Values.pullThroughCacheIp | quote }}
      persistence: true
      pvc:
        storage: 100Gi
      mountConfig: true
      configFiles:
        config.json: |-
          {
            "storage": { "rootDirectory": "/var/lib/registry", "gc": true, "dedupe": true },
            "http": { "address": "0.0.0.0", "port": "5000" },
            "log": { "level": "info" },
            "extensions": {
              "sync": {
                "enable": true,
                "registries": [
                  {{- $last := sub (len .Values.pullThroughCacheRegistries) 1 }}
                  {{- range $i, $host := keys .Values.pullThroughCacheRegistries | sortAlpha }}
                  {"urls": ["{{ index $.Values.pullThroughCacheRegistries $host }}"], "onDemand": true, "tlsVerify": true, "content": [{"prefix": "**", "destination": "/{{ $host }}"}]}{{ if lt $i $last }},{{ end }}
                  {{- end }}
                ]
              }
            }
          }

