# Optional (disable) and opt-in (enable) catalog entries, the same in every layer.
suite: optional
templates: [templates/applications.yaml]
tests:
  - it: an opt-in component is off by default
    values: [../../examples/baremetal.yaml]
    set: { layer: core, enable: [], pullThroughCacheIp: "" }
    asserts:
      - notEqual: { path: metadata.name, value: zot }
  - it: enabling zot renders it as a LoadBalancer on the requested IP
    values: [../../examples/baremetal.yaml]
    set: { layer: core, enable: [zot], pullThroughCacheIp: 10.10.0.5 }
    documentSelector: { path: metadata.name, value: zot }
    asserts:
      - equal: { path: spec.source.helm.valuesObject.service.type, value: LoadBalancer }
      - equal:
          path: 'spec.source.helm.valuesObject.service.annotations["lbipam.cilium.io/ips"]'
          value: 10.10.0.5
      - equal: { path: spec.source.helm.valuesObject.persistence, value: true }
  - it: zot mirrors each upstream registry on demand under its host name
    values: [../../examples/baremetal.yaml]
    set: { layer: core, enable: [zot], pullThroughCacheIp: 10.10.0.5 }
    documentSelector: { path: metadata.name, value: zot }
    asserts:
      - matchRegex:
          path: 'spec.source.helm.valuesObject.configFiles["config.json"]'
          pattern: '"urls":\s*\["https://registry-1.docker.io"\],\s*"onDemand":\s*true,\s*"tlsVerify":\s*true,\s*"content":\s*\[\{"prefix":\s*"\*\*",\s*"destination":\s*"/docker.io"\}\]'
  - it: an optional core component can be disabled the same way as a platform one
    values: [../../examples/baremetal.yaml]
    set: { layer: core, disable: [longhorn] }
    asserts:
      - notEqual: { path: metadata.name, value: longhorn }
  - it: runtime inspection is off by default on every provider
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core }
    asserts:
      - notEqual: { path: metadata.name, value: falco }
      - notEqual: { path: metadata.name, value: tetragon }
  - it: enabling tetragon renders it in kube-system
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core, enable: [tetragon] }
    documentSelector: { path: metadata.name, value: tetragon }
    asserts:
      - equal: { path: spec.destination.namespace, value: kube-system }
  - it: enabling falco renders it with the modern eBPF driver
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core, enable: [falco] }
    documentSelector: { path: metadata.name, value: falco }
    asserts:
      - equal: { path: spec.source.helm.valuesObject.driver.kind, value: modern_ebpf }
  - it: rook is off by default
    values: [../../examples/baremetal.yaml]
    set: { layer: core }
    asserts:
      - notEqual: { path: metadata.name, value: rook }
      - notEqual: { path: metadata.name, value: rook-ceph-cluster }
  - it: enabling rook renders a block-only Ceph cluster (the chart's block pool is the default class)
    values: [../../examples/baremetal-rook.yaml]
    set: { layer: core }
    documentSelector: { path: metadata.name, value: rook-ceph-cluster }
    asserts:
      - equal: { path: spec.destination.namespace, value: rook-ceph }
      - equal: { path: spec.source.helm.valuesObject.cephFileSystems, value: [] }
      - equal: { path: spec.source.helm.valuesObject.cephObjectStores, value: [] }
  - it: enabling rook renders the operator in rook-ceph
    values: [../../examples/baremetal-rook.yaml]
    set: { layer: core }
    documentSelector: { path: metadata.name, value: rook }
    asserts:
      - equal: { path: spec.source.chart, value: rook-ceph }
      - equal: { path: spec.destination.namespace, value: rook-ceph }
  - it: with rook, local-path-provisioner is not installed in longhorn's place
    values: [../../examples/baremetal-rook.yaml]
    set: { layer: core }
    asserts:
      - notEqual: { path: metadata.name, value: local-path-provisioner }
  - it: rook-ceph is a privileged namespace
    values: [../../examples/baremetal-rook.yaml]
    set: { layer: core }
    documentSelector: { path: metadata.name, value: rook }
    asserts:
      - equal:
          path: 'spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]'
          value: privileged
  - it: identity add-ons are off by default
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform }
    asserts:
      - notEqual: { path: metadata.name, value: authentik }
      - notEqual: { path: metadata.name, value: keycloak }
      - notEqual: { path: metadata.name, value: oauth2-proxy }
  - it: authentik uses the seeded Secret and the external Postgres from cluster values
    values: [../../examples/eks-minimal.yaml]
    set:
      layer: platform
      enable: [authentik]
      authentik: { postgresHost: db.example.com, postgresPort: 25060 }
    documentSelector: { path: metadata.name, value: authentik }
    asserts:
      - equal: { path: spec.destination.namespace, value: authentik }
      - equal:
          {
            path: spec.source.helm.valuesObject.authentik.existingSecret.secretName,
            value: authentik,
          }
      - contains:
          path: spec.source.helm.valuesObject.global.env
          content: { name: AUTHENTIK_POSTGRESQL__HOST, value: db.example.com }
      - contains:
          path: spec.source.helm.valuesObject.global.env
          content: { name: AUTHENTIK_POSTGRESQL__PORT, value: "25060" }
  - it: keycloak uses the seeded Secret and the external Postgres from cluster values
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform, enable: [keycloak], keycloak: { postgresHost: db.example.com } }
    documentSelector: { path: metadata.name, value: keycloak }
    asserts:
      - equal: { path: spec.source.chart, value: keycloakx }
      - equal: { path: spec.source.helm.valuesObject.database.hostname, value: db.example.com }
      - equal: { path: spec.source.helm.valuesObject.database.port, value: 5432 }
      - equal: { path: spec.source.helm.valuesObject.database.existingSecret, value: keycloak }
  - it: oauth2-proxy uses the OIDC issuer from cluster values and the seeded Secret
    values: [../../examples/eks-minimal.yaml]
    set:
      layer: platform
      enable: [oauth2-proxy]
      oauth2Proxy: { issuerUrl: "https://auth.example.com/application/o/proxy/" }
    documentSelector: { path: metadata.name, value: oauth2-proxy }
    asserts:
      - equal: { path: spec.source.helm.valuesObject.config.existingSecret, value: oauth2-proxy }
      - equal: { path: spec.source.helm.valuesObject.extraArgs.provider, value: oidc }
      - equal:
          path: 'spec.source.helm.valuesObject.extraArgs["oidc-issuer-url"]'
          value: https://auth.example.com/application/o/proxy/
  - it: the nfs and iscsi CSI drivers are off by default
    values: [../../examples/baremetal-minimal.yaml]
    set: { layer: core }
    asserts:
      - notEqual: { path: metadata.name, value: csi-driver-nfs }
      - notEqual: { path: metadata.name, value: democratic-csi }
  - it: csi-driver-nfs renders a non-default StorageClass on the share from cluster values
    values: [../../examples/baremetal-minimal.yaml]
    set:
      layer: core
      enable: [csi-driver-nfs]
      nfs: { server: nas.example.com, share: /export/k8s }
    documentSelector: { path: metadata.name, value: csi-driver-nfs }
    asserts:
      - equal: { path: spec.destination.namespace, value: kube-system }
      - equal: { path: spec.source.helm.valuesObject.storageClass.create, value: true }
      - equal: { path: spec.source.helm.valuesObject.storageClass.name, value: nfs-csi }
      - equal:
          {
            path: spec.source.helm.valuesObject.storageClass.parameters.server,
            value: nas.example.com,
          }
      - equal:
          { path: spec.source.helm.valuesObject.storageClass.parameters.share, value: /export/k8s }
      - notExists: { path: spec.source.helm.valuesObject.storageClass.annotations }
  - it: democratic-csi reads its driver config from the seeded Secret and runs on Talos
    values: [../../examples/baremetal-minimal.yaml]
    set: { layer: core, enable: [democratic-csi], democraticCsi: { driver: freenas-api-iscsi } }
    documentSelector: { path: metadata.name, value: democratic-csi }
    asserts:
      - equal: { path: spec.destination.namespace, value: democratic-csi }
      - equal:
          {
            path: spec.source.helm.valuesObject.driver.existingConfigSecret,
            value: democratic-csi-driver-config,
          }
      - equal:
          { path: spec.source.helm.valuesObject.driver.config.driver, value: freenas-api-iscsi }
      - equal: { path: spec.source.helm.valuesObject.node.hostPID, value: true }
      - equal:
          {
            path: spec.source.helm.valuesObject.node.driver.iscsiDirHostPath,
            value: /usr/local/etc/iscsi,
          }
      - equal: { path: "spec.source.helm.valuesObject.storageClasses[0].name", value: iscsi }
      - equal:
          { path: "spec.source.helm.valuesObject.storageClasses[0].defaultClass", value: false }
      - equal:
          path: 'spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]'
          value: privileged
  - it: metrics stacks, their CRDs, and grafana are off by default
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core }
    asserts:
      - notEqual: { path: metadata.name, value: kube-prometheus-stack }
      - notEqual: { path: metadata.name, value: victoria-metrics-k8s-stack }
      - notEqual: { path: metadata.name, value: prometheus-operator-crds }
      - notEqual: { path: metadata.name, value: grafana }
  - it: kube-prometheus-stack leaves CRDs, Grafana, and kube-state-metrics to other entries
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core, enable: [kube-prometheus-stack] }
    documentSelector: { path: metadata.name, value: kube-prometheus-stack }
    asserts:
      - equal: { path: spec.destination.namespace, value: monitoring }
      - equal: { path: spec.source.helm.valuesObject.crds.enabled, value: false }
      - equal: { path: spec.source.helm.valuesObject.grafana.enabled, value: false }
      - equal: { path: spec.source.helm.valuesObject.kubeStateMetrics.enabled, value: false }
      - equal:
          {
            path: spec.source.helm.valuesObject.prometheusOperator.admissionWebhooks.certManager.enabled,
            value: true,
          }
      - equal:
          {
            path: spec.source.helm.valuesObject.prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues,
            value: false,
          }
  - it: victoria-metrics-k8s-stack leaves Grafana and kube-state-metrics to other entries
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core, enable: [victoria-metrics-k8s-stack] }
    documentSelector: { path: metadata.name, value: victoria-metrics-k8s-stack }
    asserts:
      - equal: { path: spec.destination.namespace, value: monitoring }
      - equal: { path: spec.source.helm.valuesObject.grafana.enabled, value: false }
      - equal: { path: 'spec.source.helm.valuesObject["kube-state-metrics"].enabled', value: false }
      - equal:
          {
            path: 'spec.source.helm.valuesObject["victoria-metrics-operator"].admissionWebhooks.certManager.enabled',
            value: true,
          }
      - equal: { path: spec.source.helm.valuesObject.defaultDashboards.enabled, value: false }
  - it: grafana reads the seeded Secret and points at Prometheus
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core, enable: [kube-prometheus-stack, grafana] }
    documentSelector: { path: metadata.name, value: grafana }
    asserts:
      - equal: { path: spec.source.helm.valuesObject.admin.existingSecret, value: grafana }
      - equal:
          path: spec.source.helm.valuesObject.datasources["datasources.yaml"].datasources[0].url
          value: http://kube-prometheus-stack-prometheus.monitoring:9090
  - it: grafana points at VMSingle with VictoriaMetrics
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core, enable: [victoria-metrics-k8s-stack, grafana] }
    documentSelector: { path: metadata.name, value: grafana }
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.datasources["datasources.yaml"].datasources[0].url
          value: http://vmsingle-victoria-metrics-k8s-stack.monitoring:8428
  - it: monitoring is a privileged namespace, for node-exporter
    values: [../../examples/eks-minimal.yaml]
    set: { layer: core, enable: [kube-prometheus-stack] }
    documentSelector: { path: metadata.name, value: kube-prometheus-stack }
    asserts:
      - equal:
          path: 'spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]'
          value: privileged
  - it: arc and its runners are off by default
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform }
    asserts:
      - notEqual: { path: metadata.name, value: arc }
      - notEqual: { path: metadata.name, value: arc-runners }
  - it: enabling arc renders the controller before its runners
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform, enable: [arc], arc: { githubConfigUrl: https://github.com/example } }
    asserts:
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: arc, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: arc-runners, any: true }
  - it: arc runners register as the cluster with the seeded GitHub App in Kubernetes mode
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform, enable: [arc], arc: { githubConfigUrl: https://github.com/example } }
    documentSelector: { path: metadata.name, value: arc-runners }
    asserts:
      - equal: { path: spec.destination.namespace, value: arc-runners }
      - equal:
          { path: spec.source.helm.valuesObject.githubConfigUrl, value: https://github.com/example }
      - equal: { path: spec.source.helm.valuesObject.githubConfigSecret, value: arc-github-app }
      - equal: { path: spec.source.helm.valuesObject.runnerScaleSetName, value: eks-minimal }
      - equal: { path: spec.source.helm.valuesObject.maxRunners, value: 5 }
      - equal: { path: spec.source.helm.valuesObject.containerMode.type, value: kubernetes }
      - equal:
          path: spec.source.helm.valuesObject.controllerServiceAccount
          value: { namespace: arc-systems, name: arc-gha-rs-controller }
      - equal:
          path: 'spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]'
          value: baseline
  - it: arc.maxRunners caps the scale set
    values: [../../examples/eks-minimal.yaml]
    set:
      {
        layer: platform,
        enable: [arc],
        arc: { githubConfigUrl: https://github.com/example, maxRunners: 12 },
      }
    documentSelector: { path: metadata.name, value: arc-runners }
    asserts:
      - equal: { path: spec.source.helm.valuesObject.maxRunners, value: 12 }
  - it: openbao is off by default
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform }
    asserts:
      - notEqual: { path: metadata.name, value: openbao }
  - it: openbao runs three Raft replicas with no injector, after the default StorageClass exists
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform, enable: [openbao] }
    documentSelector: { path: metadata.name, value: openbao }
    asserts:
      - equal: { path: spec.destination.namespace, value: openbao }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "3" }
      - equal: { path: spec.source.helm.valuesObject.injector.enabled, value: false }
      - equal: { path: spec.source.helm.valuesObject.server.ha.replicas, value: 3 }
      - equal: { path: spec.source.helm.valuesObject.server.ha.raft.enabled, value: true }
  - it: openbao auto-unseals from the seeded key and joins and self-initializes
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform, enable: [openbao] }
    documentSelector: { path: metadata.name, value: openbao }
    asserts:
      - contains:
          path: spec.source.helm.valuesObject.server.extraSecretEnvironmentVars
          content: { envName: BAO_SEAL_KEY, secretName: openbao-seal, secretKey: key }
      - matchRegex:
          {
            path: spec.source.helm.valuesObject.server.ha.raft.config,
            pattern: 'seal "static"[^}]*current_key\s*=\s*"env://BAO_SEAL_KEY"',
          }
      - matchRegex:
          {
            path: spec.source.helm.valuesObject.server.ha.raft.config,
            pattern: 'leader_api_addr = "http://openbao-2.openbao-internal:8200"',
          }
      - matchRegex:
          {
            path: spec.source.helm.valuesObject.server.ha.raft.config,
            pattern: 'initialize "admin"',
          }
      - contains:
          path: spec.source.helm.valuesObject.extraObjects
          content:
            {
              apiVersion: v1,
              kind: ServiceAccount,
              metadata: { name: openbao-admin, namespace: openbao },
            }
  - it: tailscale-operator is off by default
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform }
    asserts:
      - notEqual: { path: metadata.name, value: tailscale-operator }
  - it: tailscale-operator joins the tailnet under the cluster's name, with the API proxy off
    values: [../../examples/eks-minimal.yaml]
    set: { layer: platform, enable: [tailscale-operator] }
    documentSelector: { path: metadata.name, value: tailscale-operator }
    asserts:
      - equal: { path: spec.destination.namespace, value: tailscale }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "3" }
      - equal: { path: metadata.labels.category, value: networking }
      - equal:
          {
            path: spec.source.helm.valuesObject.operatorConfig.hostname,
            value: eks-minimal-tailscale-operator,
          }
      - equal: { path: spec.source.helm.valuesObject.apiServerProxyConfig.mode, value: "false" }
      - equal:
          {
            path: 'spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]',
            value: privileged,
          }
