# Cluster root, layer roots, AppProjects, and the bare-metal LB pool (migrated from apps.bats).
suite: roots
templates: [templates/roots.yaml, templates/projects.yaml, templates/cilium-lb.yaml]
tests:
  - it: cluster layer renders both layer roots
    values: [../../examples/eks.yaml]
    set: { layer: cluster, clusterValuesFile: clusters/eks.yaml }
    template: templates/roots.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: root-core, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: root-platform, any: true }
  - it: coreOnly omits the platform root
    values: [../../examples/eks.yaml]
    set: { layer: cluster, coreOnly: true, clusterValuesFile: clusters/eks.yaml }
    template: templates/roots.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - containsDocument: { kind: Application, apiVersion: argoproj.io/v1alpha1, name: root-core }
  - it: bootstrap layer renders only the cluster root, pointed at the cluster's values
    values: [../../examples/eks.yaml]
    set: { layer: bootstrap, clusterValuesFile: clusters/eks.yaml }
    template: templates/roots.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: cluster }
      - equal: { path: spec.source.helm.valueFiles, value: [../clusters/eks.yaml] }
  - it: bootstrap layer renders both AppProjects
    values: [../../examples/eks.yaml]
    set: { layer: bootstrap, clusterValuesFile: clusters/eks.yaml }
    template: templates/projects.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - containsDocument:
          { kind: AppProject, apiVersion: argoproj.io/v1alpha1, name: core, any: true }
      - containsDocument:
          { kind: AppProject, apiVersion: argoproj.io/v1alpha1, name: platform, any: true }
  - it: root Applications require clusterValuesFile
    values: [../../examples/eks.yaml]
    set: { layer: cluster }
    template: templates/roots.yaml
    asserts:
      - failedTemplate: { errorMessage: clusterValuesFile is required }
  - it: baremetal renders the LB-IPAM pool from lbIpPool
    values: [../../examples/baremetal.yaml]
    set: { layer: cluster, clusterValuesFile: clusters/baremetal.yaml }
    template: templates/cilium-lb.yaml
    documentSelector: { path: kind, value: CiliumLoadBalancerIPPool }
    asserts:
      - equal: { path: spec.blocks, value: [{ cidr: 10.10.0.0/28 }] }
  - it: baremetal announces LB addresses over L2
    values: [../../examples/baremetal.yaml]
    set: { layer: cluster, clusterValuesFile: clusters/baremetal.yaml }
    template: templates/cilium-lb.yaml
    documentSelector: { path: kind, value: CiliumL2AnnouncementPolicy }
    asserts:
      - equal: { path: spec.loadBalancerIPs, value: true }
  - it: eks renders no LB-IPAM pool
    values: [../../examples/eks.yaml]
    set: { layer: cluster, clusterValuesFile: clusters/eks.yaml }
    template: templates/cilium-lb.yaml
    asserts:
      - hasDocuments: { count: 0 }
  - it: an empty platform layer still renders a valid AppProject
    values: [../../examples/eks-minimal.yaml]
    set: { layer: bootstrap, clusterValuesFile: clusters/eks-minimal.yaml }
    template: templates/projects.yaml
    documentSelector: { path: metadata.name, value: platform }
    asserts:
      - equal: { path: spec.sourceRepos, value: [] }
