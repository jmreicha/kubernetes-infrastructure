# Which Applications the cluster/ chart renders, per fixture and layer (migrated from apps.bats).
suite: layers
templates: [templates/applications.yaml]
tests:
  - it: eks core layer renders exactly 16 Applications
    values: [../clusters/eks.yaml]
    set:
      layer: core
    asserts:
      - hasDocuments: { count: 16 }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: gatekeeper-templates-psp,
            any: true,
          }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: gatekeeper-templates-general,
            any: true,
          }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: aws-ebs-csi-driver,
            any: true,
          }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: aws-load-balancer-controller,
            any: true,
          }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: cert-manager, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: envoy-gateway, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: external-dns, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: external-secrets, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: falco, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: gatekeeper, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: karpenter, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: kor, any: true }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: kube-state-metrics,
            any: true,
          }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: metrics-server, any: true }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
