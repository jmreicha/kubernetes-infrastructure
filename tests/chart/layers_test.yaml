      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: strimzi, any: true }
  - it: baremetal-minimal core layer renders exactly 13 Applications
    values: [../clusters/baremetal-minimal.yaml]
    set:
      layer: core
    asserts:
      - hasDocuments: { count: 13 }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: gatekeeper-templates-psp,
            any: true,
          }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: gatekeeper-templates-general,
            any: true,
          }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: cert-manager, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: envoy-gateway, any: true }
      - containsDocument:
