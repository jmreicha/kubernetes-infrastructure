      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: external-secrets, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: falco, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: gatekeeper, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: karpenter, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: kor, any: true }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: kube-state-metrics,
            any: true,
          }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: metrics-server, any: true }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: onepassword-connect,
            any: true,
          }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: opentelemetry-operator,
            any: true,
          }
  - it: eks-minimal platform layer renders exactly 0 Applications
    values: [../clusters/eks-minimal.yaml]
    set:
      layer: platform
    asserts:
      - hasDocuments: { count: 0 }
  - it: baremetal core layer renders exactly 15 Applications
    values: [../clusters/baremetal.yaml]
    set:
      layer: core
    asserts:
      - hasDocuments: { count: 15 }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: zot, any: true }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: gatekeeper-templates-psp,
            any: true,
          }
      - containsDocument:
          {
