  - it: eks platform layer renders exactly 10 Applications
    values: [../clusters/eks.yaml]
    set:
      layer: platform
    asserts:
      - hasDocuments: { count: 10 }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: argocd-image-updater,
            any: true,
          }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: atlas-operator, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: crossplane, any: true }
      - containsDocument:
