  - it: baremetal platform layer renders exactly 12 Applications
    values: [../clusters/baremetal.yaml]
    set:
      layer: platform
    asserts:
      - hasDocuments: { count: 12 }
      - containsDocument:
          {
            kind: Application,
            apiVersion: argoproj.io/v1alpha1,
            name: argocd-image-updater,
            any: true,
          }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: atlas-operator, any: true }
      - containsDocument:
          { kind: Application, apiVersion: argoproj.io/v1alpha1, name: cdi, any: true }
      - containsDocument:
