clusterName: doks
provider: doks
kubernetesVersion: "1.34"
domain: do.example.com
enable:
  - argocd-agent
  - tetragon
argocdAgent:
  principalAddress: agent.hub.example.com
  principalPort: 443
secretRefs:
  onepasswordCredentials: op://infra/doks-connect/credentials
  onepasswordToken: op://infra/doks-connect/token
  kargoAdminPasswordHash: op://infra/doks-kargo/password-hash
  kargoTokenSigningKey: op://infra/doks-kargo/signing-key
  digitaloceanToken: op://infra/digitalocean/dns-token
  githubToken: op://infra/kubechecks/github-token
  argocdAgentCa: op://infra/argocd-agent/ca
  argocdAgentCert: op://infra/argocd-agent-doks/cert
  argocdAgentKey: op://infra/argocd-agent-doks/key
