clusterName: baremetal
provider: baremetal
kubernetesVersion: "1.34"
apiServerHost: localhost
apiServerPort: 7445
lbIpPool: [10.10.0.0/28]
domain: lab.example.com
secretRefs:
  onepasswordCredentials: op://infra/lab-connect/credentials
  onepasswordToken: op://infra/lab-connect/token
  kargoAdminPasswordHash: op://infra/lab-kargo/password-hash
  kargoTokenSigningKey: op://infra/lab-kargo/signing-key
  cloudflareApiToken: op://infra/cloudflare/api-token
  githubToken: op://infra/kubechecks/github-token
enable:
  - zot
pullThroughCacheIp: 10.10.0.5
