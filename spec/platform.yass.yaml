# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  The platform layer. What applications consume: provisioning, autoscaling, restarts,
  image updates, load testing, schema migrations, environment promotion, Kafka,
  databases, and on bare metal, virtual machines.
version: v1
---
spec: Platform
INPUT:
- CONFORMS: ./core@Core::RETURN
- MUST: rely on the core layer's guarantees, including the default StorageClass that Strimzi, OpenEverest, and CDI volumes use, without re-checking them
- WHEN: the core layer has not completed when this layer starts
  MUST: stop without rendering any Application, and report that the core layer has not completed
RETURN:
- MUST: complete only when every Application rendered by this layer is Synced and Healthy
SIDE-EFFECT:
- MUST: "render one Application for every catalog entry whose layer is `platform` and whose providers include the cluster's provider, in AppProject `platform`"
- MUST: render no Application for any other catalog entry
- MUST: install the Strimzi operator watching all namespaces, with no Kafka resources
- MUST: install OpenEverest with its PostgreSQL, MySQL, and MongoDB operators and no database clusters
- MUST: install Crossplane with no providers, functions, or compositions
- MUST: install the k6 operator with no TestRun resources
- MUST: install the Atlas operator with no AtlasSchema or AtlasMigration resources
- MUST: install Kargo as a self-contained instance that promotes only between stages within this cluster, using this cluster's Argo CD, with no Projects, Warehouses, or Stages
- MUST: read the Kargo admin password hash and token signing key from the Secret seeded by SecretSeed
  SEE: ./bootstrap@SecretSeed
- MUST-NOT: configure Kargo to reach any other cluster or any Kargo control plane
ERROR:
- WHEN: any platform-layer Application is not Synced and Healthy 30 minutes after the platform root Application is applied
  MUST: fail, naming every Application that is Degraded, OutOfSync, Missing, or Progressing
- MUST: fail, report the failure, and leave the cluster as it stands
---
spec: Platform.Baremetal
INPUT:
- CONFORMS: Platform::INPUT
- MUST: "rely on nodes exposing hardware virtualization (`/dev/kvm`)"
RETURN:
- CONFORMS: Platform::RETURN
SIDE-EFFECT:
- CONFORMS: Platform::SIDE-EFFECT
- MUST: install KubeVirt with its operator and a single KubeVirt resource, the one configuration object this layer installs, because the operator deploys nothing without it
- MUST: install CDI with its operator and a single CDI resource, after KubeVirt, using the default StorageClass for imported disks
- MUST: "label the kubevirt and cdi namespaces `pod-security.kubernetes.io/enforce=privileged`"
- MUST-NOT: create any VirtualMachine, DataVolume, or VM template
- MUST-NOT: enable KubeVirt software emulation
ERROR:
- WHEN: a node lacks hardware virtualization
  MUST: fail through Platform ERROR, with kubevirt named as Degraded
- CONFORMS: Platform::ERROR
