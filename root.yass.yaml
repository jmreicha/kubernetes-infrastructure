  The catalog is closed: no project outside this table is installed by this project.
  external-dns and kubechecks are installed only when the cluster values carry a domain.
  Optionality is the same in every layer. An entry marked `optional` is installed unless the
  cluster values list it in `disable`; an entry marked `optIn` is installed only when they list
  it in `enable`; every other entry is always installed. Every platform-layer entry, longhorn,
  and local-path-provisioner are optional; zot is opt-in. local-path-provisioner is installed
  only when longhorn is disabled.
  local-path-provisioner and the gatekeeper-library templates are sourced from git; every other
  entry is a Helm chart.
