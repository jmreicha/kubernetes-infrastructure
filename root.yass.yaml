# yaml-language-server: $schema=https://shakefu.github.io/yass/v1.schema.json
---
description: >
  Cluster foundation. Given a fresh Kubernetes cluster, a provider (eks or baremetal), and
  per-cluster values, this project brings the cluster to a known state through Argo CD.
  It does so in three layers: bootstrap (Cilium and Argo CD, installed imperatively), core
  (what the cluster needs to work and be secure and observable), and platform
  (what applications consume). Each layer's Applications are rendered by a Helm app-of-apps
  chart from a fixed catalog.
version: v1
related:
  - https://github.com/shakefu/yass
  - https://argo-cd.readthedocs.io/en/stable/operator-manual/cluster-bootstrapping/
---
spec: ClusterFoundation
INPUT:
  - MUST: "accept a provider, which is exactly one of `eks` or `baremetal`"
  - MUST: "accept a cluster values file at `clusters/<cluster-name>.yaml`"
    CONFORMS: spec/values@ClusterValues
  - MUST: accept a fresh cluster with no CNI installed and nothing yet installed by this project
  - WHEN: the provider is eks
    MUST: install the eks variant of each layer
    SEE: spec/core@Core.Eks
  - WHEN: the provider is baremetal
    MUST: install the baremetal variant of each layer
    SEE: spec/core@Core.Baremetal
RETURN:
  - MUST: run the bootstrap layer, then the core layer, then the platform layer, each only after the previous layer has completed, with the ordering enforced by the cluster root Application's sync waves
    SEE: spec/bootstrap@Bootstrap
  - MUST: "report success only when every Application of every installed layer is Synced and Healthy, as scripts/bootstrap-cluster does after handover unless run with `--no-wait`"
    SEE: spec/platform@Platform
  - WHEN: the provider is baremetal
    MUST: install the baremetal variant of the platform layer
    SEE: spec/platform@Platform.Baremetal
  - WHEN: coreOnly is true in the cluster values
    MUST: stop after the core layer, reporting success on the core layer alone
ERROR:
  - WHEN: the provider is missing, or is any value other than `eks` or `baremetal`
    MUST: fail before any change is made to the cluster, and name the accepted values
  - WHEN: the cluster values file is missing or fails ClusterValues validation
    MUST: fail before any change is made to the cluster, and name each invalid or missing key
  - WHEN: a layer does not complete
    MUST: fail without starting any later layer, and report which layer failed
  - MUST: fail, report the failure, and leave the cluster exactly as it stands, with nothing rolled back and nothing deleted
SIDE-EFFECT:
  - MUST-NOT: write a secret value to git, to a log, or to any file in this repository
INVARIANT:
  - MUST: apply the security boundaries to everything it installs
    CONFORMS: spec/security@Security
  - MUST: pass Verification before any change to this repository merges
    SEE: spec/verification@Verification
  - USES: GitOpsConventions
  - USES: Catalog
---
design: GitOpsConventions
type: constraint
content: |
  Repository layout
    clusters/<cluster-name>.yaml   per-cluster values (see spec/values ClusterValues)
    cluster/                       Helm chart (the app-of-apps) that renders Argo CD
                                   Applications for one layer and one provider
    cluster/values.yaml               catalog entries: project, chart, repoURL, version,
                                   namespace, layer, providers, wave
    cluster/values.schema.json        the shape every catalog entry must have, checked on every render
    scripts/bootstrap-cluster         the imperative bootstrap (spec/bootstrap)
    policies/                        Rego: cluster values validation and render policies

  Roots
    The cluster/ chart renders by `layer`: cluster, core, or platform.
    layer=cluster renders the AppProjects (wave -1), the cilium and argo-cd
    Applications (wave 0), the core root Application (wave 1), and, unless coreOnly,
    the platform root Application (wave 2). Bootstrap applies only the AppProjects and
    the cluster root Application, which renders cluster/ with layer=cluster; Argo CD then
    manages everything, including the cluster root itself.
    Each layer root renders cluster/ with values clusters/<cluster-name>.yaml and
    layer=<layer>. With the Application health check, the platform root does not sync
    until the core root, and so every core Application, is Healthy.

  Argo CD
    One Argo CD per cluster, managing that cluster only (destination
    https://kubernetes.default.svc). Argo CD manages its own release after bootstrap.
    AppProject `core` is allowed cluster-scoped resources of any kind.
    AppProject `platform` is allowed only the cluster-scoped kinds listed in
    cluster/values.yaml `platformClusterKinds`: CustomResourceDefinition, ClusterRole,
    ClusterRoleBinding, webhook configurations, Namespace, APIService, PriorityClass,
    and the cluster-scoped custom resources its operators need.
    An Application whose chart generates a value on every render (certificates, keys,
    caBundles) lists that resource in ignoreDifferences and adds the
    RespectIgnoreDifferences=true sync option, so it reports Synced and the generated
    value is never regenerated by a sync.
    Argo CD carries a resource.customizations.health.argoproj.io_Application Lua
    check that reports a child Application's own health status, so a parent's sync
    waves wait for each child to be Healthy (Argo CD does not do this by default).
    Every Application: syncPolicy.automated with prune=true and selfHeal=true;
    syncPolicy.retry with limit 5, backoff duration 10s, factor 2, maxDuration 3m,
    and refresh=true;
    syncOptions CreateNamespace=true and ServerSideApply=true;
    finalizer resources-finalizer.argocd.argoproj.io;
    label layer=<layer>.

  Sync waves (argocd.argoproj.io/sync-wave)
    -1  AppProjects
     0  Cilium, Argo CD (adopted from bootstrap)
     1  core operators that install CRDs or admission webhooks
     2  every other core Application
     3  platform-layer Applications that depend on a StorageClass or on CRDs from wave 1
     4  every other platform-layer Application

  Version pinning
    A catalog entry whose upstream publishes no releases pins an exact commit SHA.
    Every catalog Application pins an exact chart version (targetRevision) in
    cluster/values.yaml. No ranges, no wildcards, no `latest`, no `HEAD`, no branch names.
    The exception is Applications whose source is this repository (the cluster and
    layer roots): they track `gitRevision` in cluster/values.yaml, `main` by default.
    Renovate updates the pins through a customManagers regex entry over
    cluster/values.yaml; the spec never states a version.

  Gateway API CRDs
    The envoy-gateway Application is the only owner of the Gateway API CRDs. Cilium's
    Gateway API support stays disabled, and no other Application installs them.

  Namespaces
    Each project installs into the namespace given in the catalog. Namespace labels,
    network policy, and admission constraints follow spec/security.
---
